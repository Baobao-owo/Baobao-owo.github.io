# 板块（分类）管理
# 后台「分类管理」里改的就是这个文件。
#
# name        显示名，也是文章里该填的分类名
# order       首页板块的先后（数字小的在前）
# description 板块标题下面的小字，可留空
# aliases     曾用名，逗号分隔；构建时会自动把文章里的旧分类名改成 name
#
# 没有文章的分类也会在首页占一个位置（显示「还没有文章」），
# 方便先把结构立起来，之后再往里放内容。

categories:
  - name: 杂谈
    order: 1
    description: 闲聊、杂谈、记录，想到什么写什么
    aliases: ''
  - name: 4k谱面记录
    order: 2
    description: 4K 下落式谱面，制作与记录
    aliases: ''
  - name: 中二节奏
    order: 3
    description: CHUNITHM 成绩、谱面研究
    aliases: ''
