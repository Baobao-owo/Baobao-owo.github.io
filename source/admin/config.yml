# Decap CMS 配置
# 后台：https://baobao-owo.github.io/admin/
# 登录走 DecapBridge（PKCE），提交通过它的 gateway 落到仓库 main

backend:
  name: git-gateway
  repo: Baobao-owo/Baobao-owo.github.io
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/8f0f951c-346f-401d-ad2b-c39dc10f739e/pkce
  auth_token_endpoint: /sites/8f0f951c-346f-401d-ad2b-c39dc10f739e/token
  gateway_url: https://gateway.decapbridge.com

  commit_messages:
    create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

locale: zh_Hans
site_url: https://baobao-owo.github.io
display_url: https://baobao-owo.github.io
logo_url: https://baobao-owo.github.io/assets/img/avatar-flower.jpg

media_folder: source/assets/img/uploads
public_folder: /assets/img/uploads

collections:
  - name: posts
    label: 文章
    label_singular: 一篇文章
    folder: source/_posts
    create: true
    slug: "{{slug}}"
    identifier_field: title
    summary: "{{title}}  ·  {{date | date('YYYY-MM-DD')}}"
    sortable_fields: [date, title]
    fields:
      - label: 标题
        name: title
        widget: string
      - label: 发布日期
        name: date
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: HH:mm
        format: "YYYY-MM-DD HH:mm:ss"
      - label: 分类
        name: categories
        widget: string
        default: 随笔
        hint: 直接填分类名；写一个没见过的，首页就会多一块板块
      - label: 标签
        name: tags
        widget: list
        required: false
        default: []
        allow_add: true
      - label: 正文
        name: body
        widget: markdown
        hint: 想让首页显示摘要，在正文里单独加一行 <!--more-->

  - name: pages
    label: 页面
    label_singular: 一个页面
    folder: source/about
    create: false
    slug: "{{slug}}"
    identifier_field: title
    fields:
      - label: 标题
        name: title
        widget: string
      - label: 日期
        name: date
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: HH:mm
        format: "YYYY-MM-DD HH:mm:ss"
      - label: 布局
        name: layout
        widget: hidden
        default: page
      - label: 评论
        name: comments
        widget: hidden
        default: false
      - label: 正文
        name: body
        widget: markdown
